# Nightly refresh of the committed external-data snapshots
# (src/data/generated/*.json) consumed by GitHubPanel and VideoFacade.
# Runs half an hour before deploy.yml's daily rebuild: pushes made with the
# default GITHUB_TOKEN never retrigger workflows, so it is that rebuild that
# ships whatever this job commits.
# Requires the YOUTUBE_API_KEY secret only once content references a videoId.
name: sync

permissions:
  contents: write

on:
  schedule:
    - cron: '47 8 * * *' # nightly snapshot refresh
  workflow_dispatch:

concurrency:
  group: sync

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/sync-external.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/generated
          if ! git diff --cached --quiet; then
            git commit -m 'Sync external data snapshots'
            git push
          fi
