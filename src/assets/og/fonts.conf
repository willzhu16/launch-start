<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig setup for the OG card renderer (src/pages/og/[...path].png.ts).
     sharp's SVG text renderer resolves fonts through fontconfig, which cannot
     rasterize the woff2 files in public/fonts, so the two families the cards
     use are committed here as TTFs (both OFL-licensed, from Google Fonts).
     Paths are relative to this file; the cache dir is gitignored. -->
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="relative">cache</cachedir>
</fontconfig>
